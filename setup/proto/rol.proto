syntax = "proto3";

package roles;

message Empty {}

message Rol{
    int64 idrol = 1;
    string nombre = 2;
}

message RolListResponse{
    repeated Rol roles = 1;
}

service RolService{
    rpc GetRoles(Empty) returns (RolListResponse);
    rpc updateRoles(Rol) returns (Empty);
}