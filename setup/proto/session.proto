syntax = "proto3";

package session;

message LoginRequest {
  string usuario_email = 1;
  string clave = 2;
}

message LoginResponse {
  bool suceso = 1;
  string token = 2;
}

message InfoRequest{

}

message InfoResponse{
  int64 idusuario = 1;
  string nombreUsuario = 2;
  int64 rol = 3;
}

service LoginService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc ObtenerInfo(InfoRequest) returns (InfoResponse);
}